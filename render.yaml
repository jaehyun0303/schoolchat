# Render 무료 플랜 + Turso(무료 DB). 데이터는 Turso에 저장되므로 서버가 재시작돼도 기록이 남아요.
services:
  - type: web
    name: dtalk
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        sync: false   # Render 화면에서 직접 입력 (libsql://... 주소)
      - key: TURSO_AUTH_TOKEN
        sync: false   # Render 화면에서 직접 입력 (비밀 토큰 - 절대 깃허브에 올리지 마세요)
